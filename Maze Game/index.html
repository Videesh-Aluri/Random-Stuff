<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="script.js"></script>
  <link rel="stylesheet" href="style.css">
    <title>Maze</title>
</head>
<body>
    <div class="gameContainer">
         <h1>Maze Game</h1>
        <button id="button" onclick="generateMaze()">Generate Maze</button> 
         <input type="checkbox" id="Invis">
         <label>Make maze invisible</label>
        <h3>Instructions: Use W, A, S, D keys to move the player.</h3>
        <h3>Reach the end point!</h3>
        <h3>Maze generation may take a moment.</h3>
        <h3>Good luck!</h3>
        <h5>Note: Genrated Maze may be impossible to sovle click generate maze if this happens and get a new one</h5>
        <div class="maze" id="maze">
            <!-- All grid spots will be generated by JavaScript -->
        </div>
    </div>
</body>
</html>
